<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - MyRestaurant</title>

<style>
/* =========================
   Global Styles
========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #fff8f0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* =========================
   Header
========================= */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 3rem;
    background-color: #ff6f3c;
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

header .logo {
    font-size: 2rem;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 2rem;
}

nav a {
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
}

nav a:hover {
    color: #ffe8d6;
}

/* =========================
   Menu Section
========================= */
.menu {
    flex: 1;
    padding: 3rem 2%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2rem;
}

.menu h2 {
    width: 100%;
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 2rem;
    color: #ff6f3c;
}

/* Card Styles */
.menu .card {
    background: #fff;
    border-radius: 15px;
    width: 220px;
    padding: 1rem;
    text-align: center;
    box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s, box-shadow 0.3s;
}

.menu .card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
}

.menu .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 1rem;
    transition: transform 0.3s;
}

.menu .card img:hover {
    transform: scale(1.1);
}

.menu .card h3 {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    color: #ff6f3c;
}

.menu .card p {
    font-weight: bold;
    margin-bottom: 0.5rem;
}

.menu .card button {
    padding: 0.5rem 1.5rem;
    border: none;
    background-color: #ff6f3c;
    color: #fff;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    transition: background 0.3s, transform 0.3s;
}

.menu .card button:hover {
    background-color: #ff7f50;
    transform: scale(1.05);
}

/* =========================
   Footer
========================= */
footer {
    background-color: #ff6f3c;
    color: #fff;
    text-align: center;
    padding: 1.5rem 2rem;
    margin-top: auto; /* stick to bottom */
    font-size: 0.9rem;
}

#google_translate_element {
    margin-top: 0.5rem;
}

/* =========================
   Responsive
========================= */
@media (max-width: 768px) {
    nav {
        flex-wrap: wrap;
        gap: 1rem;
    }
    .menu .card {
        width: 45%;
    }
}

@media (max-width: 480px) {
    .menu .card {
        width: 100%;
    }
    .menu h2 {
        font-size: 2rem;
    }
}
</style>
</head>

<body>

<!-- Header -->
<header>
    <h1 class="logo">MyRestaurant</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
</header>

<!-- Menu Section -->
<section class="menu">
    <h2>Our Menu</h2>

    <div class="card">
        <img src="images\Burger.png" alt="Burger">
        <h3>Burger</h3>
        <p>$10</p>
        <button onclick="addToCart('Burger',10)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="images\pizza.png" alt="Pizza">
        <h3>Pizza</h3>
        <p>$15</p>
        <button onclick="addToCart('Pizza',15)">Add to Cart</button>
    </div>
     <div class="card">
        <img src="images\egg tomato.png" alt="Egg Tomato">
        <h3>Egg Tomato</h3>
        <p>$8</p>
        <button onclick="addToCart('Bean Salad',8)">Add to Cart</button>
    </div>

    <!-- You can add more cards here for menu items -->
</section>

<!-- Footer -->
<footer>
    &copy; 2026 MyRestaurant. All Rights Reserved.
    <div id="google_translate_element"></div>
</footer>

<script src="js/cart.js"></script>
<script>
function googleTranslateElementInit() {
    new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
}
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
