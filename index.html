<!DOCTYPE html>

    <style>
        /* Header & Navigation */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            background-color: #ff6f3c; /* Restoring the solid orange matching colors */
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header .logo {
            font-family: 'Playfair Display', serif; /* Elegant heading */
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            margin: 0;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            font-family: Arial, sans-serif; /* Familiar, not too crazy */
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            font-size: 1.05rem;
            transition: color 0.3s ease;
            margin: 0;
        }

        nav a:hover, nav a.active {
            color: #ffe8d6;
        }

        /* Mobile Nav Flexibility */
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }
        @media(max-width: 768px) {
            .mobile-toggle { display: block; }
            #main-nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #ff6f3c;
                padding: 1rem 0;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }
            #main-nav.show { display: flex; }
            #main-nav a { padding: 10px 20px; width: 100%; text-align: left; }
        }


        /* =========================
            Global Styles
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0; /* Remove default body margins */
}

/* =========================
   Hero Section Fix
========================= */
/* 1. Ensure the Hero Section takes up the full width of the screen */
.hero {
    width: 100%;           /* Fills the horizontal space */
    height: 80vh;          /* Keeps your preferred height */
    position: relative;
    overflow: hidden;      /* Prevents horizontal scrollbars */
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 2. Force the image to stretch across the empty space */
.hero-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;           
    height: 100%;          
    object-fit: cover;      
    z-index: 1;
}


.hero-text {
    position: relative;
    z-index: 2;            /* Keeps text and buttons above the image */
    text-align: center;
    color: #b75c1a;
}
main { /* or whatever container holds your image, but not the header */
    flex: 1; /* Pushes the footer down, if you have one */
    display: flex;
    justify-content: center; /* Center horizontally */
    align-items: center;     /* Center vertically */
    width: 100vw;           /* Ensure full page width is used */
    background-color: #fff;  /* Or whatever your main background is */
}
main img {
    
    max-width: 90vw; /* Image will occupy up to 90% of screen width */
    height: auto;     /* Maintain aspect ratio */
    
    
    margin: 5vw; /* Example: 5% of viewport width on all sides */
    
    /* Add optional visual flair, like in the gallery */
    border-radius: 15px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
}

/* Full-Width (Hero) */
.hero { /* Replace with your actual hero section container */
    width: 100vw;      /* Crucial: full viewport width */
    height: 80vh;      /* You decide the height */
    position: relative;
    overflow: hidden;  /* Prevents horizontal scrollbar */
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-img { /* Apply to the image itself */
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;       /* Fills the container's width */
    height: 100%;      /* Fills the container's height */
    object-fit: cover;  /* CROPS the image to fit, no stretching */
    z-index: 1;        /* Puts image behind text */
}

.hero-text { /* Style for text on top of the image */
    position: relative;
    z-index: 2; /* Keeps text above the image */
    text-align: center;
    color: #ef8120;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
}


      .hero iframe {
    position: absolute;
    top: 50%;

    left: 50%;
    width: 100%;  /* full width */
    height: 100%;  /* full height */
    max-height: 100vh; /* never taller than viewport */
    transform: translate(-50%, -50%);
    object-fit: cover;
}



        .hero-text h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero-text .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background-color: #ff6f3c;
            color: #fff;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .hero-text .btn:hover {
            background-color: #ff7f50;
            transform: scale(1.05);
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* =========================
            Featured Section
        ========================= */
        .featured {
            padding: 4rem 3rem;
            background-color: #fff4e6;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }

        .featured h2 {
            width: 100%;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #ff6f3c;
        }

        .featured .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            border-radius: 15px;
            padding: 1rem;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 220px;
        }

        .featured .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .featured .card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #ff6f3c;
        }

        .featured .card p {
            font-size: 1rem;
            font-weight: bold;
            color: #333;
        }

        .featured .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .featured .card:hover img {
            transform: scale(1.1);
        }

        /* =========================
            Footer
        ========================= */
        footer {
            padding: 2rem 3rem;
            background-color: #ff6f3c;
            color: #fff;
            text-align: center;
            position: relative;
        }

        /* =========================
            Responsive
        ========================= */
        @media(max-width: 768px) {
            
            .hero-text h2 { font-size: 2rem; }
            .featured .card { width: 45%; }
        }

        @media(max-width: 480px) {
            .featured .card { width: 100%; }
        }
    </style>
