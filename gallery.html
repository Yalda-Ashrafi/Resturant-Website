<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - MyRestaurant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Header & Navigation */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fff8f0; display: flex; flex-direction: column; min-height: 100vh; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            background-color: #ff6f3c;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            margin: 0;
        }

        nav { display: flex; gap: 2rem; align-items: center; }
        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            font-size: 1.05rem;
            transition: color 0.3s ease;
        }
        nav a:hover, nav a.active { color: #ffe8d6; }

        /* Mobile Nav Flexibility */
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }
        @media(max-width: 768px) {
            .mobile-toggle { display: block; }
            #main-nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #ff6f3c;
                padding: 1rem 0;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }
            #main-nav.show { display: flex; }
            #main-nav a { padding: 10px 20px; width: 100%; text-align: left; }
        }


        /* Gallery Styles */
        .gallery-container {
    flex: 1;
    padding: 4rem 5%; /* Increased side padding for better focus */
    text-align: center;
}
        
        .gallery-container h2 {
            font-size: 2.8rem;
            color: #ff6f3c;
            margin-bottom: 3rem;
            font-family: 'Playfair Display', serif;
        }

       .gallery-grid {
    display: grid;
    /* This automatically adjusts columns based on screen size */
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
}
.photo-slot {
    background-color: #fff;
    border-radius: 15px;
    overflow: hidden; /* This hides the image corners to match the border-radius */
    aspect-ratio: 1 / 1;
    display: block; /* Changed from flex to block for images */
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* Slightly stronger shadow */
}

        .photo-slot:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 25px rgba(255, 111, 60, 0.2); /* Tinted shadow on hover */
}

       .photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* This makes the image fill the square without stretching */
    display: block;
    transition: transform 0.5s ease;
}
.photo-slot:hover img {
    transform: scale(1.1); /* Zoom effect when you hover over the card */
}
       .photo-slot i, .photo-slot p {
    display: none;
}

        /* Footer */
        footer {
            background-color: #ff6f3c;
            color: #fff;
            text-align: center;
            padding: 1.5rem 2rem;
            margin-top: auto;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
    <h1 class="logo">MyRestaurant</h1>
    <button class="mobile-toggle" onclick="toggleNav()"><i class="fa-solid fa-bars"></i></button>
    <nav id="main-nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
</header>

    <section class="gallery-container">
    <h2>Restaurant Gallery</h2>
    
    <div class="gallery-grid">
        <div class="photo-slot">
            <img src="images2\Jelabi.png" alt="Kabuli Pulao with lamb and carrots">
        </div>

        <div class="photo-slot">
            <img src="images2\Jalebi.png" alt="Steamed Mantoo dumplings with yogurt sauce">
        </div>

        <div class="photo-slot">
            <img src="images2\FISH2.png" alt="Assorted grilled lamb and chicken kebabs">
        </div>

        <div class="photo-slot">
            <img src="images2\FISH.png" alt="Crispy stuffed Bolani flatbread">
        </div>

        <div class="photo-slot">
            <img src="images2\Gosh Feel.png" alt="Freshly diced Afghan Salata">
        </div>

        <div class="photo-slot">
            <img src="images2\Baklava.png" alt="Shir Yakh ice cream with pistachios">
        </div>

        <div class="photo-slot">
            <img src="images2\yogurt_drink.png" alt="Traditional pink Sheer Chai">
        </div>

        <div class="photo-slot">
            <img src="images2\juice.png" alt="Creamy Firnee dessert with cardamom">
        </div>
    </div>
</section>

    <!-- Footer -->
    <footer>
        &copy; 2026 MyRestaurant. All Rights Reserved.
    </footer>

    <script src="cart.js"></script>
<script>
    function toggleNav() {
        var nav = document.getElementById('main-nav');
        if(nav) nav.classList.toggle('show');
    }
</script>
</body>
</html>
