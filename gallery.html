<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - MyRestaurant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Header & Navigation */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fff8f0; display: flex; flex-direction: column; min-height: 100vh; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            background-color: #ff6f3c;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            margin: 0;
        }

        nav { display: flex; gap: 2rem; align-items: center; }
        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            font-size: 1.05rem;
            transition: color 0.3s ease;
        }
        nav a:hover, nav a.active { color: #ffe8d6; }

        /* Mobile Nav Flexibility */
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }
        @media(max-width: 768px) {
            .mobile-toggle { display: block; }
            #main-nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #ff6f3c;
                padding: 1rem 0;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }
            #main-nav.show { display: flex; }
            #main-nav a { padding: 10px 20px; width: 100%; text-align: left; }
        }


        /* Gallery Styles */
        .gallery-container {
            flex: 1;
            padding: 4rem 2%;
            text-align: center;
        }
        
        .gallery-container h2 {
            font-size: 2.8rem;
            color: #ff6f3c;
            margin-bottom: 3rem;
            font-family: 'Playfair Display', serif;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .photo-slot {
            background-color: #ebebeb;
            border: 2px dashed #cccccc;
            border-radius: 15px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999999;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            cursor: pointer;
        }

        .photo-slot:hover {
            background-color: #f7f7f7;
            border-color: #ff6f3c;
            color: #ff6f3c;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .photo-slot i {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .photo-slot p {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Footer */
        footer {
            background-color: #ff6f3c;
            color: #fff;
            text-align: center;
            padding: 1.5rem 2rem;
            margin-top: auto;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
    <h1 class="logo">MyRestaurant</h1>
    <button class="mobile-toggle" onclick="toggleNav()"><i class="fa-solid fa-bars"></i></button>
    <nav id="main-nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
</header>

    <!-- Gallery Section -->
    <section class="gallery-container">
        <h2>Restaurant Gallery</h2>
        
        <div class="gallery-grid">
            <!-- Empty Photo Slots -->
            <div class="photo-slot">
                <i class="fa-solid fa-camera"></i>
                <p>Empty Slot</p>
            </div>
            <div class="photo-slot">
                <i class="fa-solid fa-camera"></i>
                <p>Empty Slot</p>
            </div>
            <div class="photo-slot">
                <i class="fa-solid fa-camera"></i>
                <p>Empty Slot</p>
            </div>
            <div class="photo-slot">
                <i class="fa-solid fa-camera"></i>
                <p>Empty Slot</p>
            </div>
            <div class="photo-slot">
                <i class="fa-solid fa-camera"></i>
                <p>Empty Slot</p>
            </div>
            <div class="photo-slot">
                <i class="fa-solid fa-camera"></i>
                <p>Empty Slot</p>
            </div>
            <div class="photo-slot">
                <i class="fa-solid fa-camera"></i>
                <p>Empty Slot</p>
            </div>
            <div class="photo-slot">
                <i class="fa-solid fa-camera"></i>
                <p>Empty Slot</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        &copy; 2026 MyRestaurant. All Rights Reserved.
    </footer>

    <script src="cart.js"></script>
<script>
    function toggleNav() {
        var nav = document.getElementById('main-nav');
        if(nav) nav.classList.toggle('show');
    }
</script>
</body>
</html>
